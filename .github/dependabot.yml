version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tools:
        dependency-type: development
    ignore:
      # @astrojs/check (astro check) only supports TypeScript 5 and 6 so far.
      # Remove this once it accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
